name: Lint & Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-build:
    runs-on: ubuntu-latest
    environment: actions
    env:
      APP_KEYS: "ci-app-key-1,ci-app-key-2"
      API_TOKEN_SALT: "ci-api-token-salt"
      ADMIN_JWT_SECRET: "ci-admin-jwt-secret"
      NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
      STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
      TRANSFER_TOKEN_SALT: "ci-transfer-token-salt"
      JWT_SECRET: "ci-jwt-secret"
      ENCRYPTION_KEY: "ci-encryption-key"
      NODE_ENV: production
      steps:
        - name: Check out branch
          uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

        - name: Set up pnpm
          uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

        - name: Set up Node.js
          uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
          with:
            node-version: 24
            cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        # Strapi's TS types are generated from schema files and live under cms/types
        # (gitignored). Run typegen before typecheck so tsc has them on disk.
        - name: Generate Strapi types
          run: pnpm --filter ./cms run typegen

        - name: Prettier
          run: pnpm run format:check

        - name: ESLint
          run: pnpm run lint:js

        - name: Stylelint
          run: pnpm run lint:css

        - name: Typecheck
          run: pnpm run typecheck

        - name: Build web
          run: pnpm --filter ./web run build

        - name: Build cms
          run: pnpm --filter ./cms run build

        - name: Build storybook
          run: pnpm --filter ./storybook run build
