name: Lint & Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-build:
    runs-on: ubuntu-latest
    environment: actions
    env:
      APP_KEYS: "ci-app-key-1,ci-app-key-2"
      API_TOKEN_SALT: "ci-api-token-salt"
      ADMIN_JWT_SECRET: "ci-admin-jwt-secret"
      NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
      STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
      TRANSFER_TOKEN_SALT: "ci-transfer-token-salt"
      JWT_SECRET: "ci-jwt-secret"
      ENCRYPTION_KEY: "ci-encryption-key"
      NODE_ENV: production
      steps:
        - name: Check out branch
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up pnpm
          uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

        - name: Set up Node.js
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
            node-version: 24
            cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        # Strapi's TS types are generated from schema files and live under cms/types
        # (gitignored). Run typegen before typecheck so tsc has them on disk.
        - name: Generate Strapi types
          run: pnpm --filter ./cms run typegen

        - name: Prettier
          run: pnpm run format:check

        - name: ESLint
          run: pnpm run lint:js

        - name: Stylelint
          run: pnpm run lint:css

        - name: Typecheck
          run: pnpm run typecheck

        - name: Build web
          run: pnpm --filter ./web run build

        - name: Build cms
          run: pnpm --filter ./cms run build

        - name: Build storybook
          run: pnpm --filter ./storybook run build
