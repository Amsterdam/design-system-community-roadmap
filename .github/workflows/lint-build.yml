name: Lint & Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-build:
    runs-on: ubuntu-latest
    # Strapi reads these at build time. They are throwaway values used only to
    # let the admin bundle compile in CI, they never touch real environments.
    env:
      APP_KEYS: "ci-app-key-1,ci-app-key-2"
      API_TOKEN_SALT: "ci-api-token-salt"
      ADMIN_JWT_SECRET: "ci-admin-jwt-secret"
      NEXT_PUBLIC_STRAPI_URL: "https://example.com"
      STRAPI_API_TOKEN: "example"
      TRANSFER_TOKEN_SALT: "ci-transfer-token-salt"
      JWT_SECRET: "ci-jwt-secret"
      ENCRYPTION_KEY: "ci-encryption-key"
      NODE_ENV: production
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Strapi's TS types are generated from schema files and live under cms/types
      # (gitignored). Run typegen before typecheck so tsc has them on disk.
      - name: Generate Strapi types
        run: pnpm --filter ./cms run typegen

      - name: Prettier
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint:js

      - name: Stylelint
        run: pnpm run lint:css

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build web
        run: pnpm --filter ./web run build

      - name: Build cms
        run: pnpm --filter ./cms run build

      - name: Build storybook
        run: pnpm --filter ./storybook run build
