name: Lint & Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-build:
    runs-on: ubuntu-latest
    environment: actions
    env:
      APP_KEYS: "ci-app-key-1,ci-app-key-2"
      API_TOKEN_SALT: "ci-api-token-salt"
      ADMIN_JWT_SECRET: "ci-admin-jwt-secret"
      NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
      STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
      TRANSFER_TOKEN_SALT: "ci-transfer-token-salt"
      JWT_SECRET: "ci-jwt-secret"
      ENCRYPTION_KEY: "ci-encryption-key"
      NODE_ENV: production
      steps:
        - name: Check out branch
          uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

        - name: Set up pnpm
          uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

        - name: Set up Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
            node-version: 24
            cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        # Strapi's TS types are generated from schema files and live under cms/types
        # (gitignored). Run typegen before typecheck so tsc has them on disk.
        - name: Generate Strapi types
          run: pnpm --filter ./cms run typegen

        - name: Prettier
          run: pnpm run format:check

        - name: ESLint
          run: pnpm run lint:js

        - name: Stylelint
          run: pnpm run lint:css

        - name: Typecheck
          run: pnpm run typecheck

        - name: Build web
          run: pnpm --filter ./web run build

        - name: Build cms
          run: pnpm --filter ./cms run build

        - name: Build storybook
          run: pnpm --filter ./storybook run build
